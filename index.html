<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Meine Webseite</title>
		<link rel="stylesheet" href="styles.css" />
		<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/typeit@8.8.7/dist/index.umd.js"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="loadingText">
			<span class="loading">Portfolio</span>
			<span class="loading">Kai Weber</span>
		</div>

		<nav class="NaviBar">
			<ul class="NaviBox">
				<li class="NaviElement"><a href="#Intro">Intro</a></li>
				<li class="NaviElement"><a href="#Portfollio">Portfolio</a></li>
				<li class="NaviElement"><a href="#Arbeiten">Arbeiten</a></li>
				<li class="NaviElement"><a href="#Prozess">Prozess</a></li>
				<li class="NaviElement"><a href="#kontakt">Kontakt</a></li>
			</ul>
		</nav>

		<!-- Verschiedene Sektionen -->
		<section id="Intro">
			<div id="three-container"></div>
		</section>

		<section id="Portfollio">
			<div class="portfolioBox">
				<div class="imageBox">
					<img
						src="assets/images/KaiBild.jpg"
						loading="lazy"
						class="kaiBild"
						alt="KaiBild"
					/>
				</div>

				<div class="textBox">
					<div id="typewriter"></div>
				</div>
			</div>
		</section>

		<section id="Arbeiten">
			<div class="ArbeitenWrapSticky">
				<div class="ArbeitenWrap">
					<ul class="gallery">
						<li class="galleryItem">
							<img src="assets/images/HST.jpg" />
						</li>
						<li class="galleryItem">
							<img src="assets/images/wein doch.jpg" />
						</li>
						<li class="galleryItem">
							<img src="assets/images/Kairamik.jpg" />
						</li>
						<li class="galleryItem">
							<img src="assets/images/clo3d.jpg" />
						</li>
						<li class="galleryItem">
							<img src="assets/images/hocker.jpg" />
						</li>
						<li class="galleryItem">
							<img src="assets/images/3dVerbindungen1.jpg" />
						</li>
						<li class="galleryItem">
							<img src="assets/images/3dVerbindungen2.jpg" />
						</li>
					</ul>
				</div>
			</div>
		</section>

		<section id="Prozess" class="carousel">
			<div class="carousel-slide active">
				<div class="slide-header">
					<button class="slide-nav prev">&#9664;</button>
					<h2>Digitale Ausstellung</h2>
					<button class="slide-nav next">&#9654;</button>
				</div>
				<div class="carousel-content">
					<div class="media-container">
						<iframe
							src="https://www.youtube.com/embed/ZGS5nneizoY"https:
							loading="lazy"
							frameborder="0"
							allow="
								accelerometer;
								gyroscope;
								autoplay;
								encrypted-media;
								picture-in-picture;
							"
							allowfullscreen
							class="media-item active"
						></iframe>
					</div>
					<p class="project-desc">360-Grad-Video</p>
				</div>
			</div>

			<div class="carousel-slide">
				<div class="slide-header">
					<button class="slide-nav prev">&#9664;</button>
					<h2>Renderings</h2>
					<button class="slide-nav next">&#9654;</button>
				</div>
				<div class="carousel-content">
					<div class="media-container">
						<video muted loop autoplay playsinline class="media-item active">
							<source src="assets/videos/keypad.mp4" type="video/mp4" />
						</video>
						<video muted loop autoplay playsinline class="media-item">
							<source src="assets/videos/zitronenpresse.mp4" type="video/mp4" />
						</video>
						<div class="media-controls">
							<button class="media-prev">&#9664;</button>
							<button class="media-next">&#9654;</button>
						</div>
					</div>
					<p class="project-desc">Beschreibung zum ersten Video des Keypads.</p>
				</div>
			</div>

			<!-- Du kannst hier weitere Slides ergänzen -->
		</section>

		<section id="kontakt">
			<div class="left">
				<h2>
					<span>K</span><span>O</span><span>N</span><span>T</span><span>A</span
					><span>K</span><span>T</span>
				</h2>
			</div>
			<div class="right">
				<p>
					Kontaktiere mich gerne per E-Mail:
					<a
						href="mailto:kweber@hfk-bremen.de?subject=Portfolio&body=Hallo%20Kai"
					>
						<span class="email-text">kweber@hfk-bremen.de</span>
					</a>
				</p>
			</div>
		</section>

		<section id="end">
			<div class="logoTextBox">
				<img src="assets/images/kw1.svg" alt="KW" class="Logo" />
				<div class="endText">Made by Kai Weber</div>
			</div>

			<div class="box">
				<a href="Impressum.html">Impressum</a>
				<a href="Datenschutz.html">Datenschutz</a>
			</div>
		</section>

		<script src="script.js"></script>
	</body>
</html>
